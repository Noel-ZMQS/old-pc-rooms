<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>俄罗斯方块</title>
<style>
body{font-family:宋体;}
canvas{border:1px solid #000000;background:#dddddd;}
button{font-size:14px;}
</style>
</head>
<body>

<h2>俄罗斯方块</h2>
<p>得分：<span id="score">0</span></p>
<p>玩法：左方向键左移，右方向键右移，上方向键旋转，下方向键加速下落，空格键直接落到底。</p>

<canvas id="cv" width="200" height="400"></canvas>
<br><br>
<button onclick="restart()">重新开始</button>
<button onclick="location.href='index.html'">返回列表</button>

<script>
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var COLS = 10;
var ROWS = 20;
var BS = 20;

var shapes = new Array();
shapes.push([[1,1,1,1]]);
shapes.push([[1,1],[1,1]]);
shapes.push([[0,1,0],[1,1,1]]);
shapes.push([[1,0,0],[1,1,1]]);
shapes.push([[0,0,1],[1,1,1]]);
shapes.push([[1,1,0],[0,1,1]]);
shapes.push([[0,1,1],[1,1,0]]);

var colors = new Array('#00cccc','#cccc00','#cc00cc','#3333ff','#ff8800','#00aa00','#dd0000');

var board;
var cur;
var cx;
var cy;
var ccolor;
var score;
var over;
var timer;

function restart(){
    board = new Array();
    for(var r=0; r<ROWS; r++){
        board.push(new Array());
        for(var c=0; c<COLS; c++){
            board[r].push(0);
        }
    }
    score = 0;
    over = false;
    document.getElementById('score').innerHTML = score;
    newPiece();
    if(timer){
        clearInterval(timer);
    }
    timer = setInterval(tick, 400);
    draw();
}

function newPiece(){
    var n = Math.floor(Math.random()*shapes.length);
    cur = shapes[n];
    ccolor = colors[n];
    cx = 3;
    cy = 0;
    if(hit(cur, cx, cy)){
        gameOver();
    }
}

function hit(shape, x, y){
    for(var r=0; r<shape.length; r++){
        for(var c=0; c<shape[r].length; c++){
            if(shape[r][c]){
                var nx = x + c;
                var ny = y + r;
                if(nx < 0 || nx >= COLS || ny >= ROWS){
                    return true;
                }
                if(ny >= 0 && board[ny][nx]){
                    return true;
                }
            }
        }
    }
    return false;
}

function rotate(m){
    var r = m.length;
    var c = m[0].length;
    var nm = new Array();
    var i, j;
    for(j=0; j<c; j++){
        nm.push(new Array());
        for(i=0; i<r; i++){
            nm[j].push(0);
        }
    }
    for(i=0; i<r; i++){
        for(j=0; j<c; j++){
            nm[j][r-1-i] = m[i][j];
        }
    }
    return nm;
}

function merge(){
    for(var r=0; r<cur.length; r++){
        for(var c=0; c<cur[r].length; c++){
            if(cur[r][c]){
                var ny = cy + r;
                var nx = cx + c;
                if(ny >= 0){
                    board[ny][nx] = ccolor;
                }
            }
        }
    }
}

function clearLines(){
    var lines = 0;
    for(var r=ROWS-1; r>=0; r--){
        var full = true;
        for(var c=0; c<COLS; c++){
            if(!board[r][c]){
                full = false;
            }
        }
        if(full){
            for(var k=r; k>0; k--){
                for(var c2=0; c2<COLS; c2++){
                    board[k][c2] = board[k-1][c2];
                }
            }
            for(var c3=0; c3<COLS; c3++){
                board[0][c3] = 0;
            }
            lines = lines + 1;
            r = r + 1;
        }
    }
    if(lines > 0){
        score = score + lines * 100;
        document.getElementById('score').innerHTML = score;
    }
}

function tick(){
    if(over){
        return;
    }
    if(!hit(cur, cx, cy+1)){
        cy = cy + 1;
    }else{
        merge();
        clearLines();
        newPiece();
    }
    draw();
}

function drop(){
    if(over){
        return;
    }
    while(!hit(cur, cx, cy+1)){
        cy = cy + 1;
    }
    merge();
    clearLines();
    newPiece();
    draw();
}

function gameOver(){
    over = true;
    clearInterval(timer);
    draw();
    ctx.fillStyle = '#ff0000';
    ctx.font = '20px 宋体';
    ctx.fillText('游戏结束', 40, 200);
}

function draw(){
    ctx.fillStyle = '#dddddd';
    ctx.fillRect(0, 0, cv.width, cv.height);
    for(var r=0; r<ROWS; r++){
        for(var c=0; c<COLS; c++){
            if(board[r][c]){
                ctx.fillStyle = board[r][c];
                ctx.fillRect(c*BS, r*BS, BS, BS);
                ctx.strokeStyle = '#000000';
                ctx.strokeRect(c*BS, r*BS, BS, BS);
            }
        }
    }
    for(var r2=0; r2<cur.length; r2++){
        for(var c2=0; c2<cur[r2].length; c2++){
            if(cur[r2][c2]){
                ctx.fillStyle = ccolor;
                ctx.fillRect((cx+c2)*BS, (cy+r2)*BS, BS, BS);
                ctx.strokeStyle = '#000000';
                ctx.strokeRect((cx+c2)*BS, (cy+r2)*BS, BS, BS);
            }
        }
    }
}

document.onkeydown = function(e){
    e = e || window.event;
    var k = e.keyCode;
    if(over){
        return;
    }
    if(k === 37){
        if(!hit(cur, cx-1, cy)){ cx = cx - 1; }
    }else if(k === 39){
        if(!hit(cur, cx+1, cy)){ cx = cx + 1; }
    }else if(k === 38){
        var nr = rotate(cur);
        if(!hit(nr, cx, cy)){ cur = nr; }
    }else if(k === 40){
        if(!hit(cur, cx, cy+1)){ cy = cy + 1; }
    }else if(k === 32){
        drop();
    }
    draw();
};

restart();
</script>

</body>
</html>
