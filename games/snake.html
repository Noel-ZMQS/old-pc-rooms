<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>贪吃蛇</title>
<style>
body{font-family:宋体;}
canvas{border:1px solid #000000;background:#eeeeee;}
button{font-size:14px;}
</style>
</head>
<body>

<h2>贪吃蛇</h2>
<p>得分：<span id="score">0</span></p>
<p>玩法：用键盘的方向键控制蛇的方向，吃到红色方块加 10 分。撞到墙或者撞到自己就结束。</p>

<canvas id="cv" width="400" height="400"></canvas>
<br><br>
<button onclick="restart()">重新开始</button>
<button onclick="location.href='index.html'">返回列表</button>

<script>
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var SIZE = 20;
var COLS = 20;
var ROWS = 20;

var snake;
var dir;
var food;
var score;
var over;
var timer;

function restart(){
    snake = new Array();
    snake.push({x:10, y:10});
    snake.push({x:9, y:10});
    snake.push({x:8, y:10});
    dir = {x:1, y:0};
    score = 0;
    over = false;
    document.getElementById('score').innerHTML = score;
    makeFood();
    if(timer){
        clearInterval(timer);
    }
    timer = setInterval(tick, 120);
    draw();
}

function makeFood(){
    var ok = false;
    while(!ok){
        food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)};
        ok = true;
        for(var i=0; i<snake.length; i++){
            if(snake[i].x === food.x && snake[i].y === food.y){
                ok = false;
            }
        }
    }
}

function tick(){
    if(over){
        return;
    }
    var head = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
    if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS){
        gameOver();
        return;
    }
    for(var i=0; i<snake.length; i++){
        if(snake[i].x === head.x && snake[i].y === head.y){
            gameOver();
            return;
        }
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
        score = score + 10;
        document.getElementById('score').innerHTML = score;
        makeFood();
    }else{
        snake.pop();
    }
    draw();
}

function gameOver(){
    over = true;
    clearInterval(timer);
    draw();
    ctx.fillStyle = '#ff0000';
    ctx.font = '30px 宋体';
    ctx.fillText('游戏结束', 130, 200);
}

function draw(){
    ctx.fillStyle = '#eeeeee';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(food.x*SIZE, food.y*SIZE, SIZE, SIZE);
    for(var i=0; i<snake.length; i++){
        if(i === 0){
            ctx.fillStyle = '#333333';
        }else{
            ctx.fillStyle = '#666666';
        }
        ctx.fillRect(snake[i].x*SIZE, snake[i].y*SIZE, SIZE, SIZE);
    }
}

document.onkeydown = function(e){
    e = e || window.event;
    var k = e.keyCode;
    if(k === 37 && dir.x !== 1){ dir = {x:-1, y:0}; }
    else if(k === 38 && dir.y !== 1){ dir = {x:0, y:-1}; }
    else if(k === 39 && dir.x !== -1){ dir = {x:1, y:0}; }
    else if(k === 40 && dir.y !== -1){ dir = {x:0, y:1}; }
};

restart();
</script>

</body>
</html>
